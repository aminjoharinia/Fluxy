name: fluxy_example
description: "Fluxy example : routes with bindings , StateController with obx , translations , snackbars ."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.8.0
  fluxy:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # FluxyTestMode (Fluxy.arguments in tests) is not exported by package:fluxy.
  fluxy_nav:
    path: ../packages/fluxy_nav

flutter:
  uses-material-design: true
