name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      # Each package on its own: it must not reach outside its own
      # dependencies, and its own tests must pass.
      - name: Packages (analyze + test)
        run: |
          set -e
          for p in packages/*/; do
            echo "::group::$p"
            (cd "$p" && flutter pub get && flutter analyze)
            if [ -d "$p/test" ]; then (cd "$p" && flutter test); fi
            echo "::endgroup::"
          done

      # The umbrella package (re-exports everything) and its tests.
      - name: Umbrella (analyze + test)
        run: |
          flutter pub get
          flutter analyze lib test
          if [ -d test ]; then flutter test; fi

      # The example apps build against the local packages; they rot unseen
      # when nothing analyzes them.
      - name: Examples (analyze + test)
        run: |
          set -e
          for e in example example_nav2; do
            echo "::group::$e"
            (cd "$e" && flutter pub get && flutter analyze && flutter test)
            echo "::endgroup::"
          done
