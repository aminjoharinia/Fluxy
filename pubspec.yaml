name: fluxy
description: "Fluxy umbrella package : re-exports fluxy_core , fluxy_state , fluxy_nav , fluxy_i18n , fluxy_utils and fluxy_ui ."
version: 1.5.0
repository: https://github.com/aminjoharinia/Fluxy
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.8.0
  fluxy_core:
    path: packages/fluxy_core
  fluxy_i18n:
    path: packages/fluxy_i18n
  fluxy_nav:
    path: packages/fluxy_nav
  fluxy_state:
    path: packages/fluxy_state
  fluxy_ui:
    path: packages/fluxy_ui
  fluxy_utils:
    path: packages/fluxy_utils

dev_dependencies:
  cupertino_ui: ^1.1.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
